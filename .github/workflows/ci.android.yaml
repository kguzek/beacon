name: CI / Android

on:
  push:
    branches:
      - main
    paths:
      - apps/android/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.android.yaml
  pull_request:
    branches:
      - main
    paths:
      - apps/android/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.android.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi --target x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install Android SDK packages
        run: |
          ndk="$(sed -n 's/^ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;${ndk}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate bindings
        run: ./build.sh bindings

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Run lint
        run: ./gradlew lint

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: Beacon-android
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/
            apps/android/app/build/test-results/
          retention-days: 7
