name: CI / Publisher

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +1.96.0 fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publisher-clippy

      - name: Run Clippy
        run: cargo +1.96.0 clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publisher-test

      - name: Run unit, integration, and documentation tests
        run: cargo +1.96.0 test --locked --workspace --all-features

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: publisher-release

      - name: Build release binary
        run: cargo +1.96.0 build --locked --release -p beacon-publisher
