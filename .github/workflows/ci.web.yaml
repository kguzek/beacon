name: CI / Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check formatting
            command: pnpm exec prettier --check web/ package.json pnpm-workspace.yaml
          - name: lint
            command: pnpm lint
          - name: test
            command: pnpm test
          - name: check schema
            command: pnpm schema && git diff --exit-code -- docs/schema/
          - name: build
            command: pnpm build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Set up locations
        run: cp locations.example.json web/public/locations.json

      - name: Run check
        run: ${{ matrix.command }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install Chromium and system dependencies
        run: pnpm --filter @beacon/web exec playwright install --with-deps chromium

      - name: Set up locations
        run: cp locations.example.json web/public/locations.json

      - name: Build web app
        run: pnpm build

      - name: Run browser tests
        run: pnpm test:e2e --grep-invert 'static OCI frontend' --forbid-only --workers=1 --reporter=html --trace=retain-on-failure

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: web-playwright
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Install Chromium and system dependencies
        run: pnpm --filter @beacon/web exec playwright install --with-deps chromium

      - name: Set up locations
        run: cp locations.example.json web/public/locations.json

      - name: Build publisher and web images
        run: |
          docker build --file publisher/Containerfile --tag localhost/beacon-publisher:ci .
          docker build --file web/Containerfile --tag localhost/beacon-web:ci .

      - name: Start publisher and web containers
        run: |
          host=localhost
          if [[ "${DOCKER_HOST:-}" =~ ^tcp://([^:/]+) ]]; then
            host="${BASH_REMATCH[1]}"
          fi
          echo "DOCKER_HOSTNAME=${host}" >> "$GITHUB_ENV"

          docker network create beacon-ci

          docker create --name beacon-prometheus \
            --network beacon-ci --network-alias prometheus \
            --publish 19090:9090 \
            docker.io/library/node:24-alpine node /prometheus.mjs
          docker cp web/tests/fixtures/prometheus.mjs beacon-prometheus:/prometheus.mjs
          docker start beacon-prometheus
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors "http://${host}:19090/api/v1/query"

          config="${RUNNER_TEMP}/publisher"
          mkdir -p "${config}/etc/beacon"
          cp examples/config.toml examples/services.yaml "${config}/etc/beacon/"
          cat > "${config}/etc/beacon/ci.toml" <<EOF
          [server]
          allowed_origins = ["http://${host}:8081"]
          EOF
          docker create --name beacon-publisher \
            --network beacon-ci \
            --publish 8080:8080 \
            localhost/beacon-publisher:ci \
            --config.path /etc/beacon/config.toml --config.path /etc/beacon/ci.toml
          tar -C "${config}" -cf - etc | docker cp - beacon-publisher:/
          docker start beacon-publisher

          cat > "${RUNNER_TEMP}/locations.json" <<EOF
          {"locations":[{"id":"primary","name":"Primary server","url":"http://${host}:8080"}]}
          EOF
          docker create --name beacon-web \
            --publish 8081:8080 \
            localhost/beacon-web:ci
          docker cp "${RUNNER_TEMP}/locations.json" beacon-web:/srv/locations.json
          docker start beacon-web

          curl --fail --retry 30 --retry-delay 1 --retry-all-errors "http://${host}:8080/healthz"
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors "http://${host}:8080/v1/current"
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors "http://${host}:8081/"

      - name: Run live publisher contract test
        env:
          BEACON_LIVE: "1"
        run: BEACON_WEB_URL="http://${DOCKER_HOSTNAME}:8081" pnpm test:e2e live.spec.ts --forbid-only --workers=1 --reporter=html --trace=retain-on-failure

      - name: Collect container logs
        if: ${{ !cancelled() }}
        run: |
          docker logs beacon-publisher > "${RUNNER_TEMP}/publisher.log" 2>&1 || true
          docker logs beacon-web > "${RUNNER_TEMP}/web.log" 2>&1 || true
          docker logs beacon-prometheus > "${RUNNER_TEMP}/prometheus.log" 2>&1 || true

      - name: Upload integration test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: web-publisher-integration
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/publisher.log
            ${{ runner.temp }}/web.log
            ${{ runner.temp }}/prometheus.log
          retention-days: 7

      - name: Stop containers
        if: ${{ always() }}
        run: |
          docker rm --force beacon-web beacon-publisher beacon-prometheus || true
          docker network rm beacon-ci || true
