name: CI / macOS

on:
  push:
    branches:
      - main
    paths:
      - apps/macos/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.macos.yaml
  pull_request:
    branches:
      - main
    paths:
      - apps/macos/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/ci.macos.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Generate bindings
        run: apps/macos/build.sh bindings

      - name: Run Swift tests
        run: swift test --package-path apps/macos

      - name: Build app bundle
        run: apps/macos/build.sh app

      - name: Package app bundle
        run: ditto -c -k --keepParent apps/macos/build/Beacon.app "${RUNNER_TEMP}/Beacon-macos.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v5
        with:
          name: Beacon-macos
          path: ${{ runner.temp }}/Beacon-macos.zip
          retention-days: 7
