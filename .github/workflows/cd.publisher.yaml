name: CD / Publisher

on:
  push:
    paths:
      - publisher/**
      - Cargo.toml
      - Cargo.lock
      - .containerignore
      - .github/workflows/cd.publisher.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/publisher" >> "$GITHUB_ENV"

      - name: Build publisher image
        run: |
          podman build \
            --file publisher/Containerfile \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push publisher image
        run: podman push "${IMAGE}:${GITHUB_SHA}"

      - name: Push latest publisher image
        if: github.ref == 'refs/heads/main'
        run: |
          podman tag "${IMAGE}:${GITHUB_SHA}" "${IMAGE}:latest"
          podman push "${IMAGE}:latest"
