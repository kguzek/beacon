name: CD / macOS

on:
  push:
    tags:
      - macos-v*
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.96.0

jobs:
  build:
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin

      - name: Build app bundle
        run: apps/macos/build.sh app

      - name: Package app bundle
        run: ditto -c -k --keepParent apps/macos/build/Beacon.app "${RUNNER_TEMP}/Beacon-macos.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: Beacon-macos
          path: ${{ runner.temp }}/Beacon-macos.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/macos-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "${RUNNER_TEMP}/Beacon-macos.zip" --repo "$GITHUB_REPOSITORY" \
            --title "Beacon for macOS ${TAG#macos-v}" --generate-notes
