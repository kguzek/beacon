services:
  publisher:
    image: localhost/beacon-publisher:latest
    build:
      context: .
      dockerfile: apps/publisher/Containerfile
    ports:
      - "${BEACON_PORT:-127.0.0.1:8080}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    environment:
      RUST_LOG: info
    volumes:
      - type: bind
        source: "${BEACON_CONFIG_DIR:-${PWD}}"
        target: /etc/beacon
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${BEACON_SERVICES_DIR:-${PWD}}"
        target: /etc/beacon-services
        read_only: true
        bind:
          create_host_path: false
